[build-system]
# XXX: If your project needs other packages to build properly, add them to this list.
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "tabsim"
version = "0.0.13"
license = {file = "LICENSE"}
readme = "README.md"
# dynamic = ["version", "readme"]
authors = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"},
]
maintainers = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"}
]
description = "Trajectory-based Radio Frequency Interference (RFI) simulations for radio interferometeric data."

requires-python = ">=3.10"  # satchecker-client floor
dependencies = [
    "jax", "dask", "xarray", "zarr<3.0.0",
    "dask-ms>=0.2.21", "scipy", "tqdm", "matplotlib",
    "astropy", "skyfield", "sgp4", "platformdirs", "numpy", "pyyaml", "pandas",
    # IAU CPS SatChecker client; credential-free orbit records. Shared with tabascal.
    # This requirement does not yet describe what the code needs. tabsim.orbit
    # imports cache.read_orbit_file and records.validated_record and passes
    # strict_response=True to both nearest-record endpoints; all three are additive
    # APIs that exist only on the client branch this was developed against, so a
    # release satisfying >=0.1.2 fails on import. It has to be pinned to the full
    # client commit carrying them before CI can install this, then replaced with
    # >=0.2.0,<0.3 once that is released and the packaged install is checked.
    # (0.1.2 was the floor for an older reason that still holds: earlier releases
    # read replay files through pandas' imprecise JSON float parser, which rounds an
    # OMM eccentricity to a different double and makes a replayed trajectory
    # disagree with the run it reproduces. tests/test_orbit.py guards that.)
    "satchecker-client>=0.1.2",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]"]
sat = ["regions"]
# ps = ["TGEpy @ git+https://github.com/chrisfinlay/TGEpy.git"]
# all = ["jax[cuda12]", "regions", "bdsf", "TGEpy @ git+https://github.com/chrisfinlay/TGEpy.git"]
# all_cpu = ["regions", "bdsf", "TGEpy @ git+https://github.com/chrisfinlay/TGEpy.git"]
ipy = ["ipython", "ipykernel"]
test = ["pytest"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.urls]
Repository = "https://github.com/chrisfinlay/tab-sim.git"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tabsim = ["data/**/*"]

[project.scripts]
tle-region = "tabsim.scripts.tle_sat_region:main"
ast-region = "tabsim.scripts.ast_region:main"
flag-data = "tabsim.scripts.flag_data:main"
sim-vis = "tabsim.scripts.sim_vis:main"
write-config = "tabsim.scripts.write_config_from_ms:main"
tabsim-import-tles = "tabsim.scripts.import_tle_files:main"
