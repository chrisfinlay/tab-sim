[build-system]
# XXX: If your project needs other packages to build properly, add them to this list.
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "tabsim"
version = "0.0.13"
license = {file = "LICENSE"}
readme = "README.md"
# dynamic = ["version", "readme"]
authors = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"},
]
maintainers = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"}
]
description = "Trajectory-based Radio Frequency Interference (RFI) simulations for radio interferometeric data."

requires-python = ">=3.10"  # satchecker-client floor
dependencies = [
    "jax", "dask", "xarray", "zarr<3.0.0",
    "dask-ms>=0.2.21", "scipy", "tqdm", "matplotlib",
    "astropy", "skyfield", "sgp4", "platformdirs", "numpy", "pyyaml", "pandas",
    # Pinned to the satchecker-client commit that carries the resolver and replay
    # API tabsim.orbit is an adapter over — resolve_orbits, read_extra_orbit_dir,
    # save_orbits_for_reuse, save_replay_orbits, load_replay_orbits and the
    # OrbitResolution result types (PR epfl-radio-astro/satchecker-client#5) — on
    # top of the strict_response, validated_record, read_orbit_file and public
    # Julian-date conversions of PR #4. This revision of #5 also carries the two
    # things tabsim's messages cannot be correct without: RejectedOrbit.error,
    # the exception that refused the candidate the rejection is *about*, and
    # OrbitInputError.code, which says whether allow_missing_checksum is the
    # remedy for a replay it could not read. To be replaced with a released
    # "satchecker-client>=<version>,<0.3" once a release contains *both* PRs and
    # the packaged install is checked; nothing older can run this module.
    "satchecker-client @ git+https://github.com/epfl-radio-astro/satchecker-client.git@bfc2cddc5ddeace7694b8161befc4a4e35b27584",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]"]
sat = ["regions"]
# ps = ["TGEpy @ git+https://github.com/chrisfinlay/TGEpy.git"]
# all = ["jax[cuda12]", "regions", "bdsf", "TGEpy @ git+https://github.com/chrisfinlay/TGEpy.git"]
# all_cpu = ["regions", "bdsf", "TGEpy @ git+https://github.com/chrisfinlay/TGEpy.git"]
ipy = ["ipython", "ipykernel"]
test = ["pytest"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.urls]
Repository = "https://github.com/chrisfinlay/tab-sim.git"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tabsim = ["data/**/*"]

[project.scripts]
tle-region = "tabsim.scripts.tle_sat_region:main"
ast-region = "tabsim.scripts.ast_region:main"
flag-data = "tabsim.scripts.flag_data:main"
sim-vis = "tabsim.scripts.sim_vis:cli"
write-config = "tabsim.scripts.write_config_from_ms:main"
tabsim-import-tles = "tabsim.scripts.import_tle_files:main"
