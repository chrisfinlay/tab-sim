[build-system]
# XXX: If your project needs other packages to build properly, add them to this list.
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "tabsim"
version = "0.0.13"
license = {file = "LICENSE"}
readme = "README.md"
# dynamic = ["version", "readme"]
authors = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"},
]
maintainers = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"}
]
description = "Trajectory-based Radio Frequency Interference (RFI) simulations for radio interferometeric data."

requires-python = ">=3.10"  # satchecker-client floor
dependencies = [
    # xarray 2026.9 writes stores through zarr 3's open_group(zarr_format=...),
    # which zarr 2 does not accept, so the zarr pin implies a ceiling here too.
    "jax", "dask", "psutil", "xarray<2026.9", "zarr<3.0.0",
    "dask-ms>=0.2.21", "scipy", "tqdm", "matplotlib",
    # tabsim.time.skyfield_time reads UTC Julian Dates through skyfield's
    # private _utc_jd; the pin protects that one call site.
    "astropy", "skyfield>=1.49,<2", "sgp4", "platformdirs", "numpy", "pyyaml", "pandas",
    # Annual aberration for the tracked phase centre, from an analytic series
    # with no ephemeris to download, so it works offline. See tabsim.time.
    "pyerfa",
    # The selection, acquisition and replay machinery tabsim.orbit adapts —
    # resolve_orbits, read_extra_orbit_dir, the replay writers and loader, the
    # OrbitResolution result types, RejectedOrbit.error and OrbitInputError.code —
    # arrived in satchecker-client 0.2.0. Nothing older can run that module.
    "satchecker-client>=0.2.0",
    # Native RFI visibility accumulation, with a pure-JAX fallback for backends
    # where its shared library cannot run.
    "ri_kernels>=0.2.1",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]", "ri_kernels[cuda12]"]
sat = ["regions"]
# ps = ["TGEpy @ git+https://github.com/chrisfinlay/TGEpy.git"]
# all = ["jax[cuda12]", "regions", "bdsf", "TGEpy @ git+https://github.com/chrisfinlay/TGEpy.git"]
# all_cpu = ["regions", "bdsf", "TGEpy @ git+https://github.com/chrisfinlay/TGEpy.git"]
ipy = ["ipython", "ipykernel"]
test = ["pytest", "psutil>=5.9"]
benchmark = ["pytest>=7", "pytest-benchmark>=5.1,<6", "psutil>=5.9", "nvidia-ml-py>=12; sys_platform == 'linux'"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.urls]
Repository = "https://github.com/chrisfinlay/tab-sim.git"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tabsim = ["data/**/*"]
benchmarks = ["fixtures/*.json", "README.md"]

[project.scripts]
tle-region = "tabsim.scripts.tle_sat_region:main"
ast-region = "tabsim.scripts.ast_region:main"
flag-data = "tabsim.scripts.flag_data:main"
sim-vis = "tabsim.scripts.sim_vis:cli"
write-config = "tabsim.scripts.write_config_from_ms:main"
tabsim-import-tles = "tabsim.scripts.import_tle_files:main"
