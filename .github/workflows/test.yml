name: Test on Multiple Python Versions

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["*"]
    paths:
      - "examples/**"
      - "tabsim/**"
      - "tests/**"
      # The satchecker-client requirement lives here, so a change to it changes
      # what the suite runs against; and a change to the workflow has to run
      # itself before it can be trusted.
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  test:
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest]
        os: [ubuntu-latest]
        # Test oldest, middle, and newest Python versions to reduce API load
        python-version: ["3.10", "3.11", "3.13"]

    name: Test on Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm Python version
        run: |
          python --version
          which python

      - name: Install system dependencies (Ubuntu)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y casacore-dev libboost-python-dev libcfitsio-dev wcslib-dev

      # - name: Install system dependencies (macOS)
      #   if: runner.os == 'macOS'
      #   run: |
      #     brew update
      #     brew install

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir .[test]

      # tabsim.orbit is an adapter: the selection, acquisition and replay
      # machinery is the client's, and a client without those public names
      # installs cleanly and then fails at the first simulation. The names alone
      # are not enough, though — every revision of the client's resolver branch
      # exposes them and reports the same version, so which one is installed is
      # only knowable from the commit pip recorded when it built the wheel.
      - name: Confirm the installed client is the pinned revision, with the adopted API
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import json
          import re

          import satchecker_client as sc

          required = [
              'resolve_orbits', 'read_extra_orbit_dir', 'OrbitResolution',
              'ResolvedOrbit', 'RejectedOrbit', 'EndpointAttempt',
              'ResolutionEvent', 'OrbitInputError', 'save_orbits_for_reuse',
              'save_replay_orbits', 'load_replay_orbits', 'REPLAY_IDS_FILE',
              'REPLAY_RECORDS_FILE', 'nearest_endpoints_for', 'TextOrbitCache',
          ]
          missing = [name for name in required if not hasattr(sc, name)]
          assert not missing, f'installed satchecker-client lacks {missing}'

          # The pin itself, read from the metadata that produced this install,
          # so the revision is stated in exactly one place.
          with open('pyproject.toml') as handle:
              found = re.search(
                  r'satchecker-client @ git\+[^"]+\.git@([0-9a-f]{40})', handle.read()
              )
          assert found, 'pyproject.toml does not pin satchecker-client to a commit'
          pinned = found.group(1)

          recorded = metadata.distribution('satchecker-client').read_text(
              'direct_url.json'
          )
          assert recorded, 'satchecker-client was not installed from the Git pin'
          direct_url = json.loads(recorded)
          installed = direct_url.get('vcs_info', {}).get('commit_id')
          assert installed == pinned, (
              f'installed satchecker-client is {installed}, pinned is {pinned}'
          )
          # An editable install points at a working tree, whose contents are not
          # the recorded commit and can change under the suite.
          editable = direct_url.get('dir_info', {}).get('editable', False)
          assert not editable, f'satchecker-client is installed editable: {direct_url}'

          print('satchecker_client', sc.__version__, installed, 'from', sc.__file__)
          PY
          python -m pip show satchecker-client

      # Orbital records come from IAU CPS SatChecker, which needs no credentials,
      # so there is nothing to restore here any more.
      - name: Run tests
        run: pytest
